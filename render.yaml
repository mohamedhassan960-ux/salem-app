services:
  - type: web
    name: salem-rag-backend
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AUTH_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: "https://frontend-gray-gamma-76.vercel.app,*"
      - key: GEMINI_API_KEY
        sync: false
