<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1329" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="سالم" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="سالم — المساعد الطبي للإقلاع عن التدخين المستند لأدلة منظمة الصحة العالمية 2024" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>سالم — المساعد الطبي للإقلاع عن التدخين</title>
  </head>
  <body class="antialiased" style="background-color:#F7F9FC;margin:0">
    <div id="root">
      <!-- Loading fallback shown until React mounts -->
      <div id="salem-loader" style="height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(to bottom,#040F24,#061A3A,#0B2454);font-family:Cairo,system-ui,sans-serif;color:#fff;gap:16px">
        <div style="width:72px;height:72px;border-radius:20px;background:linear-gradient(to bottom,#2D8BFF,#1E3A8A,#0B2454);display:flex;align-items:center;justify-content:center;border:1px solid rgba(77,155,255,0.3);overflow:hidden">
          <img src="/salem-logo.png" alt="سالم" style="width:100%;height:100%;object-fit:cover;border-radius:16px" onerror="this.onerror=null;this.src='/logo.png'">
        </div>
        <p style="font-size:18px;font-weight:700;margin:0">سالم</p>
        <p style="font-size:13px;color:#A5C1FF;margin:0">جارٍ تحميل المساعد الطبي...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
